plugins {
    id "com.android.application"
}

android {
    namespace "dev.petrov.yaplay"
    compileSdk 35

    defaultConfig {
        applicationId "dev.petrov.yaplay"
        minSdk 29
        targetSdk 35
        versionCode 111
        versionName "1.0.0-beta.11"
    }

    buildTypes {
        release {
            // Preserve in-place updates from the private 0.x test builds.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED",
                    "--add-opens=java.base/java.util=ALL-UNNAMED",
                    "--add-opens=java.base/java.io=ALL-UNNAMED",
                    "--add-opens=java.base/java.net=ALL-UNNAMED",
                    "--add-opens=java.base/java.security=ALL-UNNAMED",
                    "--add-opens=java.base/java.text=ALL-UNNAMED",
                    "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
                    "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
                    "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED"
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "YMPlayer-v${variant.versionName}-${variant.name}-b${variant.versionCode}.apk"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    def media3Version = "1.5.1"

    compileOnly "androidx.annotation:annotation:1.6.0"
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    implementation "androidx.core:core:1.15.0"
    implementation "net.jthink:jaudiotagger:3.0.1"
}
