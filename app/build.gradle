plugins {
    id "com.android.application"
}

android {
    namespace "dev.petrov.yaplay"
    compileSdk 35

    defaultConfig {
        applicationId "dev.petrov.yaplay"
        minSdk 29
        targetSdk 35
        versionCode 109
        versionName "1.0.0-beta.9"
    }

    buildTypes {
        release {
            // Preserve in-place updates from the private 0.x test builds.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "YMPlayer-v${variant.versionName}-${variant.name}-b${variant.versionCode}.apk"
        }
    }
}

dependencies {
    def media3Version = "1.5.1"

    compileOnly "androidx.annotation:annotation:1.6.0"
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
    implementation "net.jthink:jaudiotagger:3.0.1"
}
